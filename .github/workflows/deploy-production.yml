name: deploy-production

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref ${{ secrets.PROD_SUPABASE_PROJECT_ID }}

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Verify required GitHub Secrets are set
        env:
          STRIPE_SECRET_KEY: ${{ secrets.PROD_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}
          R2_BUCKET_NAME: ${{ secrets.PROD_R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.PROD_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PROD_R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.PROD_R2_PUBLIC_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT_JSON }}
          OPERATOR_AUTH_TOKEN: ${{ secrets.PROD_OPERATOR_AUTH_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PROD_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PUBSUB_AUDIENCE: ${{ secrets.PROD_GOOGLE_PUBSUB_AUDIENCE }}
          GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL: ${{ secrets.PROD_GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL }}
          WEB_BASE_URL: ${{ secrets.PROD_WEB_BASE_URL }}
        run: |
          missing=()
          for key in \
            STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET \
            R2_BUCKET_NAME R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_PUBLIC_DOMAIN \
            CLOUDFLARE_ACCOUNT_ID \
            FIREBASE_SERVICE_ACCOUNT_JSON \
            OPERATOR_AUTH_TOKEN \
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON \
            GOOGLE_PUBSUB_AUDIENCE GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL \
            WEB_BASE_URL
          do
            if [[ -z "${!key}" ]]; then
              missing+=("$key (expected GitHub Secret: PROD_${key} or unprefixed if shared)")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required GitHub Secrets:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All required edge function secrets are populated."

      - name: Sync Supabase Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.PROD_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}
          R2_BUCKET_NAME: ${{ secrets.PROD_R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.PROD_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PROD_R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.PROD_R2_PUBLIC_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT_JSON }}
          OPERATOR_AUTH_TOKEN: ${{ secrets.PROD_OPERATOR_AUTH_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PROD_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PUBSUB_AUDIENCE: ${{ secrets.PROD_GOOGLE_PUBSUB_AUDIENCE }}
          GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL: ${{ secrets.PROD_GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL }}
          WEB_BASE_URL: ${{ secrets.PROD_WEB_BASE_URL }}
        run: |
          umask 077
          {
            printf "STRIPE_SECRET_KEY='%s'\n" "$STRIPE_SECRET_KEY"
            printf "STRIPE_WEBHOOK_SECRET='%s'\n" "$STRIPE_WEBHOOK_SECRET"
            printf "R2_BUCKET_NAME='%s'\n" "$R2_BUCKET_NAME"
            printf "R2_ACCESS_KEY_ID='%s'\n" "$R2_ACCESS_KEY_ID"
            printf "R2_SECRET_ACCESS_KEY='%s'\n" "$R2_SECRET_ACCESS_KEY"
            printf "R2_PUBLIC_DOMAIN='%s'\n" "$R2_PUBLIC_DOMAIN"
            printf "CLOUDFLARE_ACCOUNT_ID='%s'\n" "$CLOUDFLARE_ACCOUNT_ID"
            printf "FIREBASE_SERVICE_ACCOUNT_JSON='%s'\n" "$(echo "$FIREBASE_SERVICE_ACCOUNT_JSON" | jq -c .)"
            printf "OPERATOR_AUTH_TOKEN='%s'\n" "$OPERATOR_AUTH_TOKEN"
            printf "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON='%s'\n" "$(echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | jq -c .)"
            printf "GOOGLE_PUBSUB_AUDIENCE='%s'\n" "$GOOGLE_PUBSUB_AUDIENCE"
            printf "GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL='%s'\n" "$GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL"
            printf "WEB_BASE_URL='%s'\n" "$WEB_BASE_URL"
          } > /tmp/edge-functions.env
          supabase secrets set \
            --project-ref ${{ secrets.PROD_SUPABASE_PROJECT_ID }} \
            --env-file /tmp/edge-functions.env

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref ${{ secrets.PROD_SUPABASE_PROJECT_ID }} --use-api

  flutter-build:
    needs: supabase-deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./peppercheck_flutter
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Create placeholder env files
        run: |
          mkdir -p assets/env
          touch assets/env/.env.dev
          touch assets/env/.env.staging
          touch assets/env/.env.production

      - name: Generate production env file
        run: |
          cat > assets/env/.env.production <<'EOF'
          SUPABASE_URL=https://${{ secrets.PROD_SUPABASE_PROJECT_ID }}.supabase.co
          SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY }}
          WEB_DASHBOARD_URL=https://peppercheck.dev/dashboard
          EOF

      - name: Generate google-services.json
        run: echo '${{ secrets.PROD_GOOGLE_SERVICES_JSON }}' > android/app/src/production/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Extract version from tag
        id: version
        run: |
          # v0.3.0 → 0.3.0
          echo "build_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build production AAB
        run: |
          flutter build appbundle --release --flavor production -t lib/main_production.dart \
            --build-name=${{ steps.version.outputs.build_name }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-aab
          path: peppercheck_flutter/build/app/outputs/bundle/release/app-release.aab

      # TODO: Add Google Play Store upload when ready (#272)
      # - name: Upload to Google Play (internal track)
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: dev.cloveclove.peppercheck
      #     releaseFiles: build/app/outputs/bundle/release/app-release.aab
      #     track: internal
      #     status: completed

  webapp-deploy:
    needs: supabase-deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./peppercheck-webapp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: './peppercheck-webapp/.nvmrc'
          cache: 'npm'
          cache-dependency-path: './peppercheck-webapp/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Set production environment
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://${{ secrets.PROD_SUPABASE_PROJECT_ID }}.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
          EOF

      - name: Build and deploy to Cloudflare (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy -- --env production --keep-vars
