name: deploy-beta

on:
  workflow_dispatch:
  push:
    branches:
      - 'beta/v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to beta project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BETA_SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref ${{ secrets.BETA_SUPABASE_PROJECT_ID }}

      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.BETA_SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Verify required GitHub Secrets are set
        env:
          STRIPE_SECRET_KEY: ${{ secrets.BETA_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.BETA_STRIPE_WEBHOOK_SECRET }}
          R2_BUCKET_NAME: ${{ secrets.BETA_R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.BETA_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.BETA_R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.BETA_R2_PUBLIC_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.BETA_FIREBASE_SERVICE_ACCOUNT_JSON }}
          OPERATOR_AUTH_TOKEN: ${{ secrets.BETA_OPERATOR_AUTH_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.BETA_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PUBSUB_AUDIENCE: ${{ secrets.BETA_GOOGLE_PUBSUB_AUDIENCE }}
          GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL: ${{ secrets.BETA_GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL }}
          WEB_BASE_URL: ${{ secrets.BETA_WEB_BASE_URL }}
        run: |
          missing=()
          for key in \
            STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET \
            R2_BUCKET_NAME R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_PUBLIC_DOMAIN \
            CLOUDFLARE_ACCOUNT_ID \
            FIREBASE_SERVICE_ACCOUNT_JSON \
            OPERATOR_AUTH_TOKEN \
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON \
            GOOGLE_PUBSUB_AUDIENCE GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL \
            WEB_BASE_URL
          do
            if [[ -z "${!key}" ]]; then
              missing+=("$key (expected GitHub Secret: BETA_${key} or unprefixed if shared)")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required GitHub Secrets:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All required edge function secrets are populated."

      - name: Sync Supabase Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.BETA_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.BETA_STRIPE_WEBHOOK_SECRET }}
          R2_BUCKET_NAME: ${{ secrets.BETA_R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.BETA_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.BETA_R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_DOMAIN: ${{ secrets.BETA_R2_PUBLIC_DOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.BETA_FIREBASE_SERVICE_ACCOUNT_JSON }}
          OPERATOR_AUTH_TOKEN: ${{ secrets.BETA_OPERATOR_AUTH_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.BETA_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PUBSUB_AUDIENCE: ${{ secrets.BETA_GOOGLE_PUBSUB_AUDIENCE }}
          GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL: ${{ secrets.BETA_GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL }}
          WEB_BASE_URL: ${{ secrets.BETA_WEB_BASE_URL }}
        run: |
          umask 077
          {
            printf "STRIPE_SECRET_KEY='%s'\n" "$STRIPE_SECRET_KEY"
            printf "STRIPE_WEBHOOK_SECRET='%s'\n" "$STRIPE_WEBHOOK_SECRET"
            printf "R2_BUCKET_NAME='%s'\n" "$R2_BUCKET_NAME"
            printf "R2_ACCESS_KEY_ID='%s'\n" "$R2_ACCESS_KEY_ID"
            printf "R2_SECRET_ACCESS_KEY='%s'\n" "$R2_SECRET_ACCESS_KEY"
            printf "R2_PUBLIC_DOMAIN='%s'\n" "$R2_PUBLIC_DOMAIN"
            printf "CLOUDFLARE_ACCOUNT_ID='%s'\n" "$CLOUDFLARE_ACCOUNT_ID"
            printf "FIREBASE_SERVICE_ACCOUNT_JSON='%s'\n" "$FIREBASE_SERVICE_ACCOUNT_JSON"
            printf "OPERATOR_AUTH_TOKEN='%s'\n" "$OPERATOR_AUTH_TOKEN"
            printf "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON='%s'\n" "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            printf "GOOGLE_PUBSUB_AUDIENCE='%s'\n" "$GOOGLE_PUBSUB_AUDIENCE"
            printf "GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL='%s'\n" "$GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL"
            printf "WEB_BASE_URL='%s'\n" "$WEB_BASE_URL"
          } > /tmp/edge-functions.env
          supabase secrets set \
            --project-ref ${{ secrets.BETA_SUPABASE_PROJECT_ID }} \
            --env-file /tmp/edge-functions.env

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref ${{ secrets.BETA_SUPABASE_PROJECT_ID }} --use-api

  flutter-build-distribute:
    needs: supabase-deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./peppercheck_flutter
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Create placeholder env files
        run: |
          mkdir -p assets/env
          touch assets/env/.env.dev
          touch assets/env/.env.staging
          touch assets/env/.env.production

      - name: Generate staging env file
        run: |
          cat > assets/env/.env.staging <<'EOF'
          SUPABASE_URL=https://${{ secrets.BETA_SUPABASE_PROJECT_ID }}.supabase.co
          SUPABASE_ANON_KEY=${{ secrets.BETA_SUPABASE_PUBLISHABLE_KEY }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.BETA_STRIPE_PUBLISHABLE_KEY }}
          WEB_DASHBOARD_URL=https://staging.peppercheck.dev/dashboard
          EOF

      - name: Generate google-services.json
        run: echo '${{ secrets.BETA_GOOGLE_SERVICES_JSON }}' > android/app/src/staging/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Extract version from branch name
        id: version
        run: |
          # beta/v0.3 → 0.3.0-beta.N
          BASE_VERSION="${GITHUB_REF_NAME#beta/v}"
          echo "build_name=${BASE_VERSION}.0-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build staging APK
        run: |
          flutter build apk --release --flavor staging -t lib/main_staging.dart \
            --build-name=${{ steps.version.outputs.build_name }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.BETA_FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Upload to Firebase App Distribution
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.BETA_FIREBASE_APP_ID }}" \
            --groups "beta-testers" \
            --release-notes "Beta ${{ steps.version.outputs.build_name }} (${GITHUB_SHA::7})"

  webapp-deploy:
    needs: supabase-deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./peppercheck-webapp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: './peppercheck-webapp/.nvmrc'
          cache: 'npm'
          cache-dependency-path: './peppercheck-webapp/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Set staging environment
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://${{ secrets.BETA_SUPABASE_PROJECT_ID }}.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.BETA_SUPABASE_PUBLISHABLE_KEY }}
          EOF

      - name: Build and deploy to Cloudflare (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy -- --env staging
