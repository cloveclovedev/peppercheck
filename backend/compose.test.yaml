# pgBackRest local smoke stack.
#
# Brings up MinIO (S3-compatible) + the custom peppercheck-postgres image
# (`deploy/postgres`) and proves pgBackRest can stanza-create,
# push WAL, take a full backup, and pass `check` against an S3-compatible
# repo. Driven by scripts/pgbackrest-local-smoke.sh -- not part of the dev
# stack (compose.yaml/compose.override.yaml). Run with an explicit project
# name so it never touches the dev stack's `peppercheck` project/volumes:
#
#   docker compose -f compose.test.yaml -p peppercheck-test up -d
#
# ---- pgBackRest <-> MinIO TLS note ----
# pgBackRest's S3 storage driver requires TLS (minimum TLSv1.2 per the
# pgBackRest docs: https://pgbackrest.org/configuration.html) -- there is no
# plain-HTTP mode. So MinIO here is run WITH TLS (a self-signed cert
# generated by the smoke script into deploy/test-fixtures/minio-certs/,
# gitignored), and pgBackRest is told to skip certificate verification via
# repo1-storage-verify-tls=n (documented by pgBackRest as the supported way
# to use a self-signed cert for "testing or other scenarios"). This is a
# deliberate deviation from the task brief's "TLS off since endpoint is
# plain host:9000" assumption -- see task-4-report.md for detail.
#
# MinIO auto-detects TLS when public.crt/private.key are present at
# /root/.minio/certs (the default --certs-dir; MinIO's official image runs
# as root with HOME=/root), so no extra server flag is needed beyond
# mounting the cert directory.
name: peppercheck-test

services:
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./deploy/test-fixtures/minio-certs:/root/.minio/certs:ro

  createbucket:
    image: minio/mc:latest
    depends_on: [minio]
    environment:
      # mc talks to MinIO's self-signed TLS cert too; MC_INSECURE is the
      # documented env-var form of mc's --insecure flag (skip TLS verify).
      MC_INSECURE: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set local https://minio:9000 minioadmin minioadmin; do
          echo "waiting for minio..."; sleep 1
        done
        mc mb --ignore-existing local/pcbackup

  postgres:
    build: ./deploy/postgres
    environment:
      POSTGRES_DB: peppercheck
      POSTGRES_USER: postgres
      # Dummy, test-only passwords -- this stack is never exposed and is
      # torn down at the end of the smoke run.
      POSTGRES_PASSWORD: testpostgrespass
      POSTGRES_APP_PASSWORD: testapppass
      POSTGRES_MIGRATOR_PASSWORD: testmigratorpass
      POSTGRES_BACKUP_PASSWORD: testbackuppass
      # Non-secret S3 settings only -- entrypoint.sh does not touch these.
      PGBACKREST_REPO1_S3_ENDPOINT: minio
      PGBACKREST_REPO1_S3_BUCKET: pcbackup
      PGBACKREST_REPO1_S3_REGION: us-east-1
      # MinIO listens on 9000 over TLS (see note above); default repo storage
      # port is 443 so it must be overridden, and verify-tls must be turned
      # off because the cert is self-signed.
      PGBACKREST_REPO1_STORAGE_PORT: "9000"
      PGBACKREST_REPO1_STORAGE_VERIFY_TLS: "n"
    volumes:
      # Secrets MUST be files, not env: entrypoint.sh (deploy/postgres)
      # unconditionally exports PGBACKREST_REPO1_CIPHER_PASS /
      # PGBACKREST_REPO1_S3_KEY / PGBACKREST_REPO1_S3_KEY_SECRET from these
      # paths, and read_secret() returns empty (clobbering any env value)
      # when the file is absent.
      - ./deploy/test-fixtures/secrets/pgbackrest_cipher:/run/secrets/pgbackrest_cipher:ro
      - ./deploy/test-fixtures/secrets/b2_key_id:/run/secrets/b2_key_id:ro
      - ./deploy/test-fixtures/secrets/b2_key_secret:/run/secrets/b2_key_secret:ro
    depends_on:
      createbucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peppercheck"]
      interval: 5s
      timeout: 5s
      retries: 20
