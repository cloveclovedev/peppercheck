# pgBackRest configuration for the peppercheck-postgres image. Baked into the
# image (both the postgres and backup images pin the identical pgbackrest
# version). repo1-s3-endpoint / repo1-s3-bucket / repo1-s3-region /
# repo1-s3-key / repo1-s3-key-secret and repo1-cipher-pass come from
# PGBACKREST_* env at runtime (the key/secret and cipher pass are exported by
# entrypoint.sh from Docker file-based secrets) -- never baked in here.

[global]
repo1-type=s3
# MinIO (local/CI) and B2's S3-compatible endpoint both need path-style
# bucket addressing (bucket.endpoint virtual-hosted style is not assumed).
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
archive-async=y
# 15-minute RPO budget (docs/superpowers/specs/2026-07-22-phase0-baseline.md)
# translates to bursts of WAL between archive_timeout ticks; 1GiB gives
# headroom before the async spool queue is considered full.
archive-push-queue-max=1GiB
# archive-push-queue-max is only re-checked when a new async run starts, so a
# single run could exceed it before the next recheck. archive-push-batch-size
# caps the amount of WAL processed per async run, forcing the process to exit
# and respawn so the queue is rechecked. Type `size`, default 16GiB (range
# 1MiB..4PiB) per the official pgBackRest configuration reference; 64MiB (= 4
# default 16MiB WAL segments) keeps each run well below the 1GiB queue-max.
# Requires pgBackRest >= 2.59.0 (the pinned PGBACKREST_VERSION, built from
# source in the Dockerfile).
archive-push-batch-size=64MiB
spool-path=/var/spool/pgbackrest
log-path=/var/log/pgbackrest
start-fast=y

[main]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
